# Example NUT configuration for the SMS Power Sinus NG uPS3200S UPS
# (SMS Brazil 1Phase protocol over Prolific USB-Serial).
# Do NOT apply in production without validating. Copy the block to /etc/nut/ups.conf.
#
# Identified device: 067b:23d3 (Prolific Technology USB-Serial)
# Kernel driver:     pl2303
# Serial port on Linux: /dev/ttyUSB0
# Confirmed protocol:   SMS Brazil 1Phase (NUT driver `sms_ser`)
#
# Field notes (validated on this host):
#   - the `sms_ser` driver does NOT accept the `baudrate` option (the 2400 8N1 speed
#     is set internally by the driver);
#   - for manual tests, use: `NUT_STATEPATH=/tmp /lib/nut/sms_ser -x port=/dev/ttyUSB0 -s sms01`

[sms_ups3200s]
    driver = sms_ser
    port = /dev/ttyUSB0
    desc = "SMS Power Sinus NG uPS3200S - 3200VA - prototype"
