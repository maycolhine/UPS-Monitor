# Example configuration for the unified UPS REST API (upsmon).
# Copy to /etc/upsmon/upsmon.conf (or another path and pass --config).
#
# Precedence: defaults -> this file -> UPSMON_* environment variables -> command line.
# ONE process and ONE HTTP port serve ALL devices; each UPS is
# addressed by /api/v1/ups/{device_id}. Reference: docs/unified-api.md
#
# All fields are optional; the values below are the application defaults.
# Unrecognized fields in a [device:*] block go into `options` and are
# available to the driver (e.g. battery calibration).

[upsmon]

# --- HTTP API (a single port for all devices) -----------------------------
# IP of the machine that has physical access to the USB cables.
http_host = 127.0.0.1
http_port = 8080

# --- log (empty = stderr, collected by the systemd journal) ---------------
log_level = INFO
log_file =

# ==== Battery test (a ~10 s action, contract 3.0) =========================
# When enabled in the [device:*] block (allow_battery_test = true), the
# device accepts POST /api/v1/ups/{device_id}/tests, which turns on the battery for
# ~10 s and returns a predictability report (load drop, voltage/frequency
# oscillation, UPS load and estimated runtime).
#
# The test is ALWAYS the short one (test_duration_s); never the "until the battery is low" one.
# Execution runs in the collector loop (the sole owner of the serial port); the
# HTTP layer only validates and enqueues the request.

# ==== Devices ==============================================================
# One [device:<device_id>] block per UPS. The block identifier is the
# `device_id` used in the API URLs.

# --- TS Shara Universal UPS Senoidal 3200VA (Megatec/Q1 protocol) ---------
[device:tsshara-3200va-01]
brand = TS Shara
model = Universal UPS Senoidal 3200VA
protocol = megatec-q1
transport = usb-serial-cdc-acm
# empty serial_port = auto-detects the port by VID:PID
serial_port =
serial_baud = 2400
serial_timeout_s = 1.0
serial_exclusive = true
command_wait_s = 0.4
usb_vendor_id = 0483
usb_product_id = 5740
poll_interval_s = 5.0
stale_after_s = 20.0
identity_refresh_s = 3600.0
# battery: the percentage is NOT in the Megatec frame; it is ESTIMATED from the
# voltage by linear interpolation between these two calibration points (in volts).
battery_voltage_low_v = 20.1
battery_voltage_high_v = 26.8
# battery test: enables POST .../tests. Megatec has NO cancellation
# (the "abort" only stops sampling); the window is short (~10 s) for safety.
allow_battery_test = true
test_duration_s = 10.0
test_sample_interval_s = 0.4
test_cooldown_s = 300.0
test_min_battery_percent = 50.0
test_history_size = 20

# --- SMS Power Sinus NG uPS3200S (SMS Brazil 1Phase protocol) -------------
[device:sms-ups3200s-01]
brand = SMS
model = Power Sinus NG uPS3200S
protocol = sms-1phase
transport = usb-serial
serial_port =
serial_baud = 2400
serial_timeout_s = 1.0
serial_exclusive = true
command_wait_s = 0.5
usb_vendor_id = 067b
usb_product_id = 23d3
poll_interval_s = 5.0
stale_after_s = 20.0
identity_refresh_s = 3600.0
# battery: the percentage COMES from the device (Q frame); the voltage is DERIVED
# as nominal * percentage / 100. The value below is confirmed by the F command.
battery_voltage_nominal_v = 24
# battery test: the SMS knows how to cancel (D command) -> abort_supported = true.
allow_battery_test = true
test_duration_s = 10.0
test_sample_interval_s = 0.4
test_cooldown_s = 300.0
test_min_battery_percent = 50.0
test_history_size = 20
