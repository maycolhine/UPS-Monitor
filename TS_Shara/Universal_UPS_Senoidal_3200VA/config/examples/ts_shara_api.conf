# Example configuration for the TS Shara UPS REST API (v2.0).
# Copy to /etc/ts-shara-api/ts_shara_api.conf (or another path and pass --config).
#
# Precedence: defaults -> this file -> TS_SHARA_API_* environment variables -> command line.
# All fields are optional; the values below are the application defaults.
# Reference: docs/rest-api.md

[ts_shara_api]

# --- device logical identity (used in the API URLs) -----------------------
device_id = tsshara-3200va-01
device_brand = TS Shara
device_model = Universal UPS Senoidal 3200VA
protocol = megatec-q1
transport = usb-serial-cdc-acm

# --- serial communication (read-only) -------------------------------------
# empty serial_port = autodetect the port by VID:PID
serial_port =
serial_baud = 2400
serial_timeout_s = 1.0
# exclusive lock: prevents two processes from opening the same port
serial_exclusive = true
command_wait_s = 0.4
usb_vendor_id = 0483
usb_product_id = 5740

# --- collection -----------------------------------------------------------
poll_interval_s = 5.0
# a reading older than this is published as stale (HTTP 503)
stale_after_s = 20.0
identity_refresh_s = 3600.0

# --- battery charge estimation (Spec.md 7.3.4) ----------------------------
battery_voltage_low_v = 20.1
battery_voltage_high_v = 26.8

# --- HTTP API -------------------------------------------------------------
# IP of the machine itself that has physical access to the USB cable
http_host = 127.0.0.1
http_port = 8081

# --- log (empty = stderr, collected by the systemd journal) ---------------
log_level = INFO
log_file =
