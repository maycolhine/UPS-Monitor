# Example NUT configuration for the TS Shara UPS (Megatec/Q1 over USB CDC-ACM)
# Do NOT apply in production without validating. Copy the block to /etc/nut/ups.conf.
#
# Identified device:    0483:5740 (STMicroelectronics STM32 Virtual ComPort)
# Serial port on Linux: /dev/ttyACM0
# Confirmed protocol:   Megatec / Q1 (Voltronic family)

[ts_shara]
    driver = nutdrv_qx
    port = /dev/ttyACM0
    protocol = megatec
    desc = "TS Shara UPS Senoidal 3200 UNIV. 2BS USB - prototype"
