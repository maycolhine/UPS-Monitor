# Example configuration for the REST API of the SMS Power Sinus NG uPS3200S UPS (v2.0).
# Copy to /etc/sms-api/sms_api.conf (or another path and pass --config).
#
# Precedence: defaults -> this file -> SMS_API_* environment variables -> command line.
# All fields are optional; the values below are the application defaults.
# Reference: docs/rest-api.md

[sms_api]

# --- logical identity of the device (used in the API URLs) -----------------
device_id = sms-ups3200s-01
device_brand = SMS
device_model = Power Sinus NG uPS3200S
protocol = sms-1phase
transport = usb-serial

# --- serial communication (read-only) -------------------------------------
# empty serial_port = auto-detect the port by VID:PID
serial_port =
serial_baud = 2400
serial_timeout_s = 1.0
# exclusive lock: prevents two processes from opening the same port
serial_exclusive = true
command_wait_s = 0.5
usb_vendor_id = 067b
usb_product_id = 23d3

# --- collection -----------------------------------------------------------
poll_interval_s = 5.0
# a reading older than this is published as outdated (HTTP 503)
stale_after_s = 20.0
identity_refresh_s = 3600.0

# --- battery --------------------------------------------------------------
# The percentage COMES from the device (Q frame); the voltage is derived as
# nominal * percentage / 100. The value below is confirmed by command F.
battery_voltage_nominal_v = 24

# --- HTTP API -------------------------------------------------------------
# IP of the machine that has physical access to the USB cable
http_host = 127.0.0.1
http_port = 8082

# --- log (empty = stderr, collected by the systemd journal) ---------------
log_level = INFO
log_file =
