# =============================================================================
# UPS Monitor — Web Viewer
#
#   cp .env.example .env      # adjust UPS_API_BASE_URL
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down
#
# Compose reads the `.env` file in this same folder to substitute the `${...}`
# variables below. Missing variables fall back to their default values.
# =============================================================================

services:
  ups-monitor-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ups-monitor-viewer:1.0.0
    container_name: ups-monitor-viewer
    restart: unless-stopped

    # Port published on the host → internal container port.
    # The internal port is the backend's 8080; choosing 8080 on the host would
    # clash with the telemetry API.
    ports:
      - "${VIEWER_HTTP_PORT:-8090}:8080"

    environment:
      VIEWER_HTTP_HOST: "0.0.0.0"
      VIEWER_HTTP_PORT: "8080"
      VIEWER_STATIC_DIR: "/app/public"

      # Address of the telemetry API. Inside the container `localhost` is the
      # container itself — use host.docker.internal or the host's network address.
      UPS_API_BASE_URL: "${UPS_API_BASE_URL:-http://host.docker.internal:8080}"
      # Empty = discover the device through GET /api/v1/ups.
      UPS_DEVICE_ID: "${UPS_DEVICE_ID:-}"

      UPS_API_TIMEOUT_MS: "${UPS_API_TIMEOUT_MS:-4000}"
      UPS_API_CACHE_TTL_MS: "${UPS_API_CACHE_TTL_MS:-1500}"
      UPS_API_IDENTITY_TTL_MS: "${UPS_API_IDENTITY_TTL_MS:-60000}"

      VIEWER_REFRESH_INTERVAL_MS: "${VIEWER_REFRESH_INTERVAL_MS:-5000}"
      VIEWER_LOG_LEVEL: "${VIEWER_LOG_LEVEL:-info}"
      # Optional JSON with the provisional gauge bands (see .env.example).
      VIEWER_GAUGE_THRESHOLDS: "${VIEWER_GAUGE_THRESHOLDS:-}"

    # Makes `host.docker.internal` resolve to the Linux machine that hosts the
    # API (on Linux this is not automatic as it is on Docker Desktop).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
